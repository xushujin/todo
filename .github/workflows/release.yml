name: Release

# Tag-driven release (GitHub Flow: main is always releasable, a tag cuts a release).
#   git tag v1.0.0 && git push origin v1.0.0
#
# Required repository secrets for the CI signing channel:
#   TODO_KEYSTORE_BASE64    base64 of the release keystore (.jks)
#   TODO_KEYSTORE_PASSWORD  store password
#   TODO_KEY_ALIAS          key alias
#   TODO_KEY_PASSWORD       key password
#
# `base64 -i release.jks | pbcopy` (macOS) or `base64 -w0 release.jks` (Linux).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Never let two tag pushes publish at the same time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default packages include the legacy 'tools' package, which no longer
          # exists in the SDK repo and makes sdkmanager exit 1. Install only what
          # we need; AGP auto-downloads the rest (compileSdk platform, etc.).
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Verify migrations and tests
        run: |
          python3 tools/verify_schema.py
          ./gradlew testDebugUnitTest --console=plain

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TODO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::TODO_KEYSTORE_BASE64 secret is missing; a release must be signed."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release
        env:
          TODO_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          TODO_KEYSTORE_PASSWORD: ${{ secrets.TODO_KEYSTORE_PASSWORD }}
          TODO_KEY_ALIAS: ${{ secrets.TODO_KEY_ALIAS }}
          TODO_KEY_PASSWORD: ${{ secrets.TODO_KEY_PASSWORD }}
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION_NAME#v}"
          # Deterministic, monotonic versionCode from semver: 1.2.3 -> 10203.
          # Keeps published codes strictly above prior local dev builds and avoids
          # coupling to github.run_number (which restarts low on a fresh repo).
          if [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            # 10# forces decimal: a leading zero would otherwise be read as octal.
            MAJOR=$(( 10#${BASH_REMATCH[1]} ))
            MINOR=$(( 10#${BASH_REMATCH[2]} ))
            PATCH=$(( 10#${BASH_REMATCH[3]} ))
            VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
            echo "Tag $VERSION_NAME -> versionName $VERSION, versionCode $VERSION_CODE"
            ./gradlew renameReleaseApk \
              -PversionName="$VERSION" \
              -PversionCode="$VERSION_CODE" \
              --console=plain
          else
            # workflow_dispatch on a branch: fall back to the version in build.gradle.kts
            # instead of feeding a branch name into the arithmetic.
            echo "::warning::'$VERSION_NAME' is not a vX.Y.Z tag; using the version from build.gradle.kts."
            ./gradlew renameReleaseApk --console=plain
          fi

      - name: Verify APK is signed and aligned
        run: |
          APK=$(find app/build/outputs/apk/release -name 'Todo-*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::Expected Todo-<version>-release.apk, but the output directory holds:"
            ls -la app/build/outputs/apk/release || true
            exit 1
          fi
          echo "APK=$APK" >> "$GITHUB_ENV"
          BUILD_TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK" > /dev/null

      - name: Checksums
        run: |
          # Write the checksum file next to the APK with a bare file name so it can be
          # verified from any directory: sha256sum -c Todo-<version>-release.apk.sha256
          cd "$(dirname "$APK")"
          sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256"
          cat "$(basename "$APK").sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Todo ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk.sha256
          fail_on_unmatched_files: true
