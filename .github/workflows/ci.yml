name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default packages include the legacy 'tools' package, which no longer
          # exists in the SDK repo and makes sdkmanager exit 1. Install only what
          # we need; AGP auto-downloads the rest (compileSdk platform, etc.).
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Verify SQL migrations against real SQLite
        run: python3 tools/verify_schema.py

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Lint (fails on errors)
        run: ./gradlew lintDebug --console=plain

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: todo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
