# Dependabot is deliberately disabled for this repository.
#
# `updates: []` means no ecosystem is monitored, so Dependabot never opens
# version-update PRs and never shows up in the Actions tab. Previously the
# gradle ecosystem re-checked on every push that touched build.gradle.kts and
# spawned "gradle in / for androidx... - Update" runs on main, which was pure
# noise for a single-app repository. The github-actions ecosystem was removed
# earlier for the same reason (an auto-bumped action version can silently
# break the release pipeline).
#
# Library upgrades are done deliberately by hand and verified with a real
# local/CI build.
version: 2
updates: []
