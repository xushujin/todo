# Keeps the "latest libraries" requirement honest without breaking the build:
# patch/minor upgrades are proposed weekly, major upgrades need a human decision.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
    ignore:
      # AGP 9 / compileSdk 37 upgrades change the toolchain; do them deliberately.
      - dependency-name: "com.android.tools.build:gradle"
        update-types: ["version-update:semver-major"]

# The github-actions ecosystem is deliberately NOT enabled.
# Dependabot re-checks it whenever a workflow file changes, so every edit to
# release.yml spawned a burst of "Update" runs and PRs. Worse, an auto-bumped
# action version can silently break the release pipeline (setup-android@v3
# already does, see its removed 'tools' package). Action versions are upgraded
# by hand, together with a real CI run.
